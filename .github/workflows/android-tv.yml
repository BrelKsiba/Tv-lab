name: Build and publish TV Lab APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-tv.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (no credentials required)
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-lab.apk
      - name: Save APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-lab-android-tv
          path: tv-lab.apk
      - name: Create or update public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view native-v0.1.0 >/dev/null 2>&1; then
            gh release upload native-v0.1.0 tv-lab.apk --clobber
          else
            gh release create native-v0.1.0 tv-lab.apk --title "TV Lab Android TV v0.1.0" --notes "Application native Android TV pour Philips OLED848. Sans navigateur, sans root et sans réseau. APK de développement signé automatiquement pour les premiers tests."
          fi
